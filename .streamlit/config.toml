# Portal defaults. Bind address/port are set on the container command line (compose);
# in Docker only bd-live-proxy (HTTPS) is published, Streamlit stays internal.
[server]
headless = true
fileWatcherType = "none"
runOnSave = false
enableXsrfProtection = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
